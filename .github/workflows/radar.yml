name: Radar OSFL

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Build source model
        run: python scripts/run_radar.py
      - name: Validate
        run: python -m pytest -q
      - name: Commit compact outputs
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs/data || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "radar: refresh OSFL source model"
          git pull --rebase origin main
          git push origin HEAD:main
