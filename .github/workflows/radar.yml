name: Radar OSFL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  schedule:
    - cron: '17 10 * * 1'

concurrency:
  group: radar-osfl-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt 'html5lib>=1.1,<2'
      - name: Build source model
        run: python scripts/run_radar.py
      - name: Materialize OSFL universe
        run: python scripts/build_universe.py
      - name: Refine OSFL core universe
        run: python scripts/refine_universe.py
      - name: Extract Law 21440 registry
        run: python scripts/v03_law21440.py
      - name: Extract Registro 19862
        run: timeout 120s python scripts/v03_reg19862_fast.py || echo 'Registro 19.862 no disponible dentro de ventana operativa; conciliacion continua sin tratar ausencia como cero.'
      - name: Reconcile multi-registry v0.3
        run: python scripts/reconcile_v03.py
      - name: Validate
        run: python -m pytest -q
      - name: Upload analytical entity-year product
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-osfl-entity-year
          path: data/export/osfl_entity_year.parquet
          if-no-files-found: warn
          retention-days: 30
      - name: Commit compact outputs
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs/data || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "radar: refresh OSFL universe"
          git pull --rebase origin main
          git push origin HEAD:main
